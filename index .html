<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catalogue Véhicules CRB 2026-2027</title>

<style>

:root{
    --crb-red:#D91F26;
    --bg:#f4f5f7;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--bg);
}

header{
    background:white;
    padding:20px 40px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

header h1{
    margin:0;
    color:var(--crb-red);
}

.hero{

    background:var(--crb-red);
    color:white;
    text-align:center;
    padding:40px;

}

.hero h2{
    margin:0;
}

.filters{

    background:white;
    padding:20px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;

}

.filters input,
.filters select{

    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;

}

#cards{

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
    gap:25px;

    padding:25px;

}

.card{

    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.1);

}

.image-container{

    height:240px;

    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    border-bottom:1px solid #eee;

}

.image-container img{

    width:90%;
    height:auto;

    max-height:210px;

    display:block;

    transition:.3s;

}

.image-container img:hover{

    transform:scale(1.03);

}

.content{

    padding:20px;

}

.badge{

    display:inline-block;

    background:var(--crb-red);
    color:white;

    padding:5px 10px;

    border-radius:20px;

    font-size:12px;

}

.content h3{

    margin-top:15px;
    margin-bottom:15px;

}

.info{

    margin-bottom:8px;

}

.price{

    font-size:22px;
    font-weight:bold;
    color:var(--crb-red);

    margin-top:15px;

}

.btn{

    width:100%;

    padding:12px;

    border:none;

    background:var(--crb-red);

    color:white;

    border-radius:8px;

    margin-top:15px;

    cursor:pointer;

}

/* MODAL */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.6);

    z-index:999;

}

.modal-content{

    background:white;

    max-width:900px;

    margin:4% auto;

    padding:25px;

    border-radius:12px;

}

.close{

    float:right;

    font-size:30px;

    cursor:pointer;

}

.detail-photo{

    display:flex;
    justify-content:center;
    align-items:center;

    background:white;

    border:1px solid #eee;

    border-radius:10px;

    height:320px;

}

.detail-photo img{

    max-width:90%;
    max-height:280px;

}

.pdf-link{

    display:inline-block;

    margin-top:20px;

    background:#0066cc;

    color:white;

    text-decoration:none;

    padding:12px 18px;

    border-radius:8px;

}

.no-pdf{

    color:red;
    margin-top:20px;

}

footer{

    background:#222;
    color:white;
    text-align:center;
    padding:25px;

}

@media(max-width:768px){

.detail-layout{

display:block !important;

}

.modal-content{

width:95%;

}

}

</style>

</head>

<body>

<header>

<h1>Catalogue Véhicules CRB 2026-2027</h1>

</header>

<section class="hero">

<h2>Flotte Automobile Croix-Rouge de Belgique</h2>

<p>Catalogue interne de référence</p>

</section>

<section class="filters">

<input
type="text"
id="search"
placeholder="Rechercher un véhicule">

<select id="category">

<option value="">Toutes catégories</option>

<option>Fonction</option>
<option>Service</option>
<option>TPMR</option>
<option>Transport personnes</option>
<option>Transport matériel</option>

</select>

</section>

<section id="cards"></section>

<div class="modal" id="modal">

<div class="modal-content">

<span class="close">&times;</span>

<div id="modalBody"></div>

</div>

</div>

<footer>

Catalogue Véhicules CRB

</footer>

<script src="data.js"></script>

<script>

const cards=document.getElementById("cards");

function displayVehicles(list){

cards.innerHTML="";

list.forEach(v=>{

cards.innerHTML += `

<div class="card">

<div class="image-container">

<img
src="${v.photo}"
onerror="this.src='images/no-photo.jpg';">

</div>

<div class="content">

<span class="badge">${v.categorie}</span>

<h3>${v.nom}</h3>

<div class="info">⚡ ${v.energie || "-"}</div>

${v.autonomie ? `<div class="info">🔋 ${v.autonomie} km</div>` : ''}

${v.puissance ? `<div class="info">🚗 ${v.puissance} ch</div>` : ''}

${v.places ? `<div class="info">👥 ${v.places} places</div>` : ''}

${v.atn ? `<div class="info">📈 ATN : ${v.atn} €</div>` : ''}

${v.loyer ? `<div class="price">${v.loyer} €/mois</div>` : ''}

${v.prix ? `<div class="price">${v.prix.toLocaleString()} €</div>` : ''}

<button class="btn" onclick="showDetails(${v.id})">

Voir fiche

</button>

</div>

</div>

`;

});

}

function showDetails(id){

const v = vehicles.find(x=>x.id===id);

let pdf="";

if(v.pdf && v.pdf.trim()!==""){

pdf=`
<a
class="pdf-link"
href="${v.pdf}"
target="_blank">

📄 Télécharger la fiche PDF

</a>
`;

}
else{

pdf=`
<div class="no-pdf">

Aucune fiche PDF disponible

</div>
`;

}

document.getElementById("modalBody").innerHTML=`

<div
class="detail-layout"
style="
display:grid;
grid-template-columns:320px 1fr;
gap:30px;
">

<div class="detail-photo">

<img
src="${v.photo}"
onerror="this.src='images/no-photo.jpg';">

</div>

<div>

<h2>${v.nom}</h2>

<p><strong>Marque :</strong> ${v.marque || "-"}</p>

<p><strong>Catégorie :</strong> ${v.categorie || "-"}</p>

<p><strong>Energie :</strong> ${v.energie || "-"}</p>

${v.autonomie ? `<p><strong>Autonomie :</strong> ${v.autonomie} km</p>` : ''}

${v.puissance ? `<p><strong>Puissance :</strong> ${v.puissance} ch</p>` : ''}

${v.places ? `<p><strong>Places :</strong> ${v.places}</p>` : ''}

${v.atn ? `<p><strong>ATN :</strong> ${v.atn} €</p>` : ''}

${v.loyer ? `<p><strong>Loyer :</strong> ${v.loyer} €/mois</p>` : ''}

${v.prix ? `<p><strong>Prix :</strong> ${v.prix.toLocaleString()} €</p>` : ''}

<p>

<strong>Description :</strong>

</p>

<p>

${v.description || ""}

</p>

${pdf}

</div>

</div>

`;

document.getElementById("modal").style.display="block";

}

document.querySelector(".close").onclick=function(){

document.getElementById("modal").style.display="none";

}

window.onclick=function(e){

if(e.target===document.getElementById("modal")){

document.getElementById("modal").style.display="none";

}

}

function filterVehicles(){

const txt=document.getElementById("search")
.value.toLowerCase();

const cat=document.getElementById("category").value;

const filtered=vehicles.filter(v=>{

const searchMatch=v.nom.toLowerCase().includes(txt);

const categoryMatch=!cat || v.categorie===cat;

return searchMatch && categoryMatch;

});

displayVehicles(filtered);

}

document.getElementById("search")
.addEventListener("keyup",filterVehicles);

document.getElementById("category")
.addEventListener("change",filterVehicles);

displayVehicles(vehicles);

</script>

</body>

</html>
